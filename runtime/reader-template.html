<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; font-src data:;">
<title>$pagetitle$ · Book reader</title>
<style>
:root{color-scheme:light;--page:#f5f3ee;--surface:#fffefb;--ink:#253136;--muted:#617175;--line:#d9dfda;--accent:#006d68;--soft:#e7f3ed;--code:#18242d}
:root[data-theme=dark]{color-scheme:dark;--page:#121c20;--surface:#1b272c;--ink:#e4ece8;--muted:#a7b8b7;--line:#34474b;--accent:#7ed5bd;--soft:#243d3b;--code:#10191f}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:5rem}body{margin:0;background:var(--page);color:var(--ink);font:17px/1.75 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:1rem;padding:.85rem 2rem;background:var(--surface);border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:-.04em;font-size:1.45rem;color:var(--accent)}.edition{font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}button{margin-left:auto;border:1px solid var(--line);border-radius:2rem;background:var(--soft);color:var(--ink);padding:.55rem 1rem;cursor:pointer;font:inherit;font-size:.85rem}button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.layout{max-width:1280px;margin:auto;display:grid;grid-template-columns:245px minmax(0,1fr);gap:2rem;padding:2rem}nav{position:sticky;top:6rem;height:calc(100vh - 8rem);overflow:auto;padding:.5rem 1rem .5rem 0;font-size:.85rem}nav strong{display:block;color:var(--muted);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:1rem}nav a{display:block;padding:.4rem 0;text-decoration:none;color:var(--muted);line-height:1.5}nav a:hover{color:var(--accent)}main{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:2.5rem 3.5rem;box-shadow:0 8px 35px #00000005}
h1,h2,h3{line-height:1.25;letter-spacing:-.025em}h1{font-size:2.05rem;margin:2.8rem 0 1.4rem;color:var(--accent);padding-top:1.2rem;border-top:1px solid var(--line)}h1:first-child{border:0;margin-top:0;padding-top:0}h2{font-size:1.35rem;margin-top:2.3rem}h3{font-size:1.05rem;margin-top:1.9rem}p{margin:1rem 0}a{color:var(--accent);text-underline-offset:.2em}strong{font-weight:700}ul,ol{padding-left:1.5rem}li{margin:.4rem 0}blockquote{margin:1.5rem 0;padding:.2rem 1.2rem;border-left:4px solid var(--accent);background:var(--soft);border-radius:0 8px 8px 0}hr{border:0;border-top:1px solid var(--line);margin:2rem 0}
table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;margin:1.7rem 0;font-size:.9rem}th{text-align:left;background:var(--soft);font-weight:650}td,th{padding:.75rem .85rem;border-bottom:1px solid var(--line);vertical-align:top}img,svg{max-width:100%;height:auto}figure{margin:1.5rem 0}figcaption{color:var(--muted);font-size:.85rem}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.86em;background:var(--soft);padding:.15em .35em;border-radius:4px}pre{background:var(--code);color:#e7ecef;padding:1.25rem;border-radius:10px;overflow:auto;line-height:1.65;font-size:.9rem}pre code{padding:0;background:none;color:inherit}div.sourceCode{background:var(--code);border-radius:10px;margin:1.5rem 0}div.sourceCode pre{margin:0}.math.display{display:block;overflow-x:auto;padding:1.2rem .4rem;text-align:center;background:var(--soft);border-radius:10px;margin:1.5rem 0}math{font-size:1.08em}details.answer{border:1px solid var(--line);padding:1rem 1.2rem;border-radius:10px;margin:1rem 0}details.answer summary{cursor:pointer;font-weight:650;color:var(--accent)}footer{max-width:800px;margin:1rem auto 3rem;padding:0 2rem;text-align:center;color:var(--muted);font-size:.8rem}.mermaid{background:var(--soft);color:var(--ink)}
$highlighting-css$
@media(max-width:900px){.layout{grid-template-columns:1fr;padding:1rem;gap:1rem}nav{position:static;height:auto;max-height:12rem;padding:1rem}main{padding:1.5rem}header{padding:.8rem 1rem}h1{font-size:1.65rem}}@media print{header,nav,button,footer{display:none}.layout{display:block;padding:0}main{border:0;padding:0;box-shadow:none}body{font-size:11pt;background:white;color:black}pre{white-space:pre-wrap}h1{break-before:page}h1:first-child{break-before:auto}details.answer{display:none}}
</style>
</head>
<body>
<header><span class="brand">Book reader</span><button id="theme" type="button">Change theme</button></header>
<div class="layout"><nav aria-label="Reading contents"><strong>Contents</strong><div id="contents"></div></nav><main id="reading">$body$</main></div>
<footer>Saved Markdown is the source. Read at your own pace.</footer>
<script>
const root=document.documentElement;
try{root.dataset.theme=localStorage.getItem('reader-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch(e){root.dataset.theme='light'}
document.getElementById('theme').onclick=()=>{root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('reader-theme',root.dataset.theme)}catch(e){}};
for(const heading of document.querySelectorAll('main h1')){const link=document.createElement('a');link.href='#'+heading.id;link.textContent=heading.textContent;document.getElementById('contents').appendChild(link)}
</script>
<script type="module">
const diagrams=document.querySelectorAll('pre.mermaid');
if(diagrams.length){try{const {default:mermaid}=await import('https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs');mermaid.initialize({startOnLoad:false,securityLevel:'strict',theme:document.documentElement.dataset.theme==='dark'?'dark':'default'});await mermaid.run({nodes:diagrams})}catch(error){for(const diagram of diagrams){diagram.setAttribute('aria-label','Diagram source; online rendering unavailable')}}}
</script>
</body>
</html>
