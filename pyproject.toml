[project]
name = "book-reader"
version = "0.2.2"
description = "A persistent, book-scoped reading workflow for Codex."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pypdf>=5,<7",
    "typst>=0.15,<0.16",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pyright>=1.1.400,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["books", "templates", "examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
include = ["runtime", "scripts", "tests"]
exclude = ["books", "templates", "examples", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
